[project]
name = "naveen-portfolio"
version = "1.0.0"
description = "Portfolio site for Naveen Mandava — AI/ML Engineer. FastAPI + Jinja2, server rendered."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
