<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.remove("no-js");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }} — {{ profile.title }}{% endblock %}</title>
  <meta name="description" content="{{ profile.summary }}">
  <meta name="author" content="{{ profile.name }}">
  <meta name="theme-color" content="#faf7f2">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ profile.name }} — {{ profile.title }}">
  <meta property="og:description" content="{{ profile.summary }}">
  {% if site_url %}<meta property="og:url" content="{{ site_url }}">
  <link rel="canonical" href="{{ site_url }}">{% endif %}
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23faf7f2'/><text y='68' x='50' text-anchor='middle' font-family='system-ui,sans-serif' font-size='46' font-weight='700' fill='%237a4f2a'>{{ profile.initials }}</text></svg>">

  <link rel="stylesheet" href="/static/css/styles.css?v={{ asset_version }}">

  <script type="application/ld+json">
  {{ json_ld|safe }}
  </script>
</head>
<body>
  {% block body %}{% endblock %}
  <script src="/static/js/main.js?v={{ asset_version }}" defer></script>
</body>
</html>
